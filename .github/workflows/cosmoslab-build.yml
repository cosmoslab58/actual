name: cosmoslab image

# Builds ghcr.io/cosmoslab58/actual-server from the cosmoslab branch: an upstream release plus our
# patches. cosmoslab/sync.sh on bodhi rebases the branch onto each new release and pushes, which
# triggers this. Boot-tested before push; bodhi pulls :latest (Watchtower, 03:00).
on:
  push:
    branches: [cosmoslab]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cosmoslab-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: v
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Build web + server
        run: yarn build:server

      - uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/sync-server/docker/ubuntu.Dockerfile
          load: true
          tags: actual-server-testing

      - name: Test that the image boots
        timeout-minutes: 2
        run: |
          docker run --detach --network=host --name actual-server actual-server-testing
          HEALTHCMD=$(yq -r '.services.actual_server.healthcheck.test[1]' packages/sync-server/docker-compose.yml)
          until docker exec actual-server sh -c "$HEALTHCMD"; do sleep 1; done

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/sync-server/docker/ubuntu.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/cosmoslab58/actual-server:latest
            ghcr.io/cosmoslab58/actual-server:${{ steps.v.outputs.tag }}-cosmoslab
            ghcr.io/cosmoslab58/actual-server:sha-${{ github.sha }}

      - name: Container logs on failure
        if: failure()
        run: docker logs actual-server || true
